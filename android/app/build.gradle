plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.dshphone.dsh_phone"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.dshphone.dsh_phone"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // flutter_secure_storage 10.x 要求 minSdk 23
        minSdkVersion = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keyProps = new Properties()
            def keyPropsFile = rootProject.file('key.properties')
            if (keyPropsFile.exists()) {
                keyPropsFile.withInputStream { keyProps.load(it) }
            }
            storeFile = file(keyProps.getProperty('storeFile'))
            storePassword = keyProps.getProperty('storePassword')
            keyAlias = keyProps.getProperty('keyAlias')
            keyPassword = keyProps.getProperty('keyPassword')
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the release keystore (key.jks) now.
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
