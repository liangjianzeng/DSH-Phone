plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.dshphone.dsh_phone"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // flutter_local_notifications 依赖 Java 8+ API（java.time 等），
        // 低版本 Android 需要 core library desugaring。
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.dshphone.dsh_phone"
        // flutter_secure_storage 10.x 要求 minSdk 23
        minSdkVersion = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // 仅打包 arm64-v8a：sherpa-onnx 依赖的 libonnxruntime.so 很大，
        // 去掉 x86/x86_64 桌面 ABI 与 armeabi-v7a（32 位老机型，2017 年后
        // 主流手机均 arm64）共省约 50MB。需要 32 位兼容时用 --split-per-abi 出双包。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // APK 体积优化（2026-10-08）：
    //  • 原生库压缩存储（useLegacyPackaging）：APK 文件显著变小，
    //    安装时解包到 /data，运行性能不变。
    //  • Web 专用资产（sherpa_onnx_web 的 wasm/js、record_web、
    //    flutter_inappwebview_web）安卓端不会加载，插件误打包约 4.2MB，
    //    由文件底部 copyFlutterAssets* 钩子剔除（flutter 资产在 mergeAssets
    //    之后才拷入合并目录，ignoreAssetsPattern / merge 钩子均拦不住）。
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        release {
            def keyProps = new Properties()
            def keyPropsFile = rootProject.file('key.properties')
            // 签名密钥文件不存在时留空（release 回退 debug 签名兜底，见 buildTypes）
            if (keyPropsFile.exists()) {
                keyPropsFile.withInputStream { keyProps.load(it) }
                storeFile = file(keyProps.getProperty('storeFile'))
                storePassword = keyProps.getProperty('storePassword')
                keyAlias = keyProps.getProperty('keyAlias')
                keyPassword = keyProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            // 统一签名：有 key.properties 时 debug 也用 release 证书，
            // 保证 debug 包可 `install -r` 覆盖安装 release 包（签名一致）。
            def hasKey = rootProject.file('key.properties').exists()
            signingConfig = hasKey ? signingConfigs.release : signingConfigs.debug
        }
        release {
            // 有 key.properties 用 release 签名；否则回退 debug 签名，
            // 保证各打包机在未配置签名密钥时也能产出可安装 APK。
            def hasKey = rootProject.file('key.properties').exists()
            signingConfig = hasKey ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    // core library desugaring：配合 compileOptions.coreLibraryDesugaringEnabled，
    // 供 flutter_local_notifications 在 minSdk 23 上使用 java.time 等 API。
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
}

flutter {
    source = "../.."
}

// 剔除 Web 专用资产（约 4.2MB）：flutter_sherpa_onnx / record / inappwebview
// 的 web 实现在安卓端永不加载，插件资产却被无差别打包。flutter 资产由
// copyFlutterAssets<Variant> 在 mergeAssets 之后拷入合并输出目录，故钩子挂在
// 该任务末尾，扫 intermediates/assets/**/flutter_assets/packages 删除。
tasks.matching { it.name.startsWith('copyFlutterAssets') }
        .configureEach {
    doLast {
        def base = new File(project.buildDir, 'intermediates/assets')
        if (!base.isDirectory()) return
        base.eachDirRecurse { d ->
            if (d.absolutePath.replace('\\', '/')
                    .endsWith('/flutter_assets/packages')) {
                ['sherpa_onnx_web', 'record_web', 'flutter_inappwebview_web']
                        .each { pkg -> new File(d, pkg).deleteDir() }
            }
        }
    }
}
