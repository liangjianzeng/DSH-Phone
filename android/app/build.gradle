plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.dshphone.dsh_phone"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // flutter_local_notifications 依赖 Java 8+ API（java.time 等），
        // 低版本 Android 需要 core library desugaring。
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.dshphone.dsh_phone"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // flutter_secure_storage 10.x 要求 minSdk 23
        minSdkVersion = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keyProps = new Properties()
            def keyPropsFile = rootProject.file('key.properties')
            // 签名密钥文件不存在时留空（release 回退 debug 签名兜底，见 buildTypes）
            if (keyPropsFile.exists()) {
                keyPropsFile.withInputStream { keyProps.load(it) }
                storeFile = file(keyProps.getProperty('storeFile'))
                storePassword = keyProps.getProperty('storePassword')
                keyAlias = keyProps.getProperty('keyAlias')
                keyPassword = keyProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // 有 key.properties 用 release 签名；否则回退 debug 签名，
            // 保证各打包机在未配置签名密钥时也能产出可安装 APK。
            def hasKey = rootProject.file('key.properties').exists()
            signingConfig = hasKey ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    // core library desugaring：配合 compileOptions.coreLibraryDesugaringEnabled，
    // 供 flutter_local_notifications 在 minSdk 23 上使用 java.time 等 API。
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
}

flutter {
    source = "../.."
}
