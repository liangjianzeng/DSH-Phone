org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
# 跨平台说明：flutter 在检测到 Android Studio 时会强制使用其自带 JBR（Java 21），
# 导致 AGP<8.2.1 或 Jetifier 出现 Java 21 兼容问题，JAVA_HOME 无法覆盖。
# 因此各打包机通过 org.gradle.java.home 显式指向本机 JDK 17。
#   - Windows 构建机：见 BUILD.windows.md（当前已配置本机路径）。
#   - Linux / macOS / CI：见 BUILD.linux.md，将 org.gradle.java.home 改为对应 JDK 17 路径。
# （AGP 8.2 / Gradle 8.3 要求 JDK 17）
org.gradle.java.home=C:\\dev-tools\\jdk17.0.20_8
android.useAndroidX=true
# 已启用 AndroidX，无需 jetifier；且 jetifier 无法转换 Java 21 编译的依赖
# （如 flutter_secure_storage 的 bcprov-jdk18on），会导致构建失败。
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
