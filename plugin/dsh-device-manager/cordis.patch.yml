- insert:
    - id: device-manager
      name: '@local/dsh-device-manager'
      config:
        # adb 可执行文件：auto = PATH → ANDROID_HOME → %LOCALAPPDATA%\Android\Sdk\platform-tools
        adbPath: auto
        # 把"当前有哪些测试机、什么状态"写进系统提示词，让模型自己知道该去哪台机器验证
        exposeToModel: true
        sources:
          usb:
            enabled: true
          # 局域网扫段默认关闭：必须显式写 CIDR 才扫（安全默认）
          lan:
            enabled: false
            cidrs: []
            ports: [5555]
            useMdnsFirst: true
            ratePerSec: 200
            connectTimeoutMs: 250
            maxConcurrency: 32
            maxIps: 512
          tailscale:
            enabled: true
            ports: [5555]
          emulator:
            enabled: true
          # 其它机器上挂的设备：adb -a -P 5037 fork-server server 后填 "host:5037"
          remoteAdbServers: []
        poll:
          enabled: true
          # 面板轮询：3 秒一刷会把整排按钮反复 disabled，看起来就是"每两三秒闪一下"。
          # 面板打开时 60 秒足够；要盯实时状态就手动点"刷新状态"。
          panelMs: 60000
          # 顶栏徽标（台数）的独立节奏，与面板解耦。
          badgeMs: 30000
          backgroundMs: 30000
          staleAfterMs: 120000
          pruneAfter: 3
        collect:
          concurrency: 4
          perCommandTimeoutMs: 3000
          factTimeoutMs: 5000
          roundBudgetMs: 20000
        inject:
          # queue = 排队不打断当前回合；steer = 中途纠偏
          mode: queue
          template: default
          allowSteer: true
        # 注入系统提示词的设备清单（adb_devices action:"prompt" 可回读原文）
        prompt:
          # false = 只放慢变事实（身份/别名/通道/可用性）。
          # 电量、屏幕、前台应用每分钟都在变，写进提示词会让会话里同时躺着多版互相矛盾的
          # 设备表（DSH 每次文本变化都追加一条 system 消息），模型反而更容易认错设备；
          # 这些字段交给 adb_devices{action:"status"|"inspect"} 现取。
          includeVolatile: false
          maxRows: 12
          showRules: true
