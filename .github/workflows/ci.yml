# DSH-Phone 质量门禁：analyze + test（每次 push / PR）。
# 构建 APK 成本高，仅在有 tag 发版时触发（build-apk 工作流）。
#
# 门禁内容全部在 tool/ci_gate.sh 里（本地提交前跑同一个脚本，杜绝"本地绿 CI 红"
# 两套标准）。这里只负责装 SDK 与调用。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 真正的门禁：项目声明的最低支持版本（environment.sdk ^3.6.0 ⇒ Flutter 3.27）。
  # 这一条红 = 合并被拦。
  analyze-test:
    name: flutter analyze + test（基线 3.27.0）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.0'
          cache: true
      - name: pub get
        run: flutter pub get
      - name: 质量门禁
        run: bash tool/ci_gate.sh

  # 早期预警：最新 stable。Flutter 升级带来的 deprecation、上游依赖新版造成的
  # 编译期问题先在这里露头，但**不拦合并**——否则就像之前那样连续两周全红，
  # 门禁彻底失去信号价值（这是本文件重写时要守住的底线）。
  analyze-test-latest:
    name: flutter analyze + test（最新 stable·预警不拦合并）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        run: flutter pub get
      - name: 质量门禁
        run: bash tool/ci_gate.sh

  build-apk:
    name: 构建 release APK（发版）
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传 APK 到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
