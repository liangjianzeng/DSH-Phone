# DSH-Phone 质量门禁：analyze + test（每次 push / PR）。
# 构建 APK 成本高，仅在有 tag 发版时触发（build-apk 工作流）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 覆盖项目当前使用的 Dart 3.6（Flutter 3.27）与最新稳定版
        flutter: ['3.27.0', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - name: pub get
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-pub

      - name: 单元测试
        run: flutter test --no-pub

  build-apk:
    name: 构建 release APK（发版）
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 'stable'
          cache: true

      - name: pub get
        run: flutter pub get

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传 APK 到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
