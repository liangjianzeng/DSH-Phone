# DSH-Phone 质量门禁：analyze + test（每次 push / PR）。
# 构建 APK 成本高，仅在有 tag 发版时触发（build-apk 工作流）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 覆盖项目当前使用的 Dart 3.6（Flutter 3.27）与最新稳定版
        flutter: ['3.27.0', 'stable']
    steps:
      - uses: actions/checkout@v4

      # 两条 leg 分开装 SDK：`flutter-version: ''` 空串仍会被 action 当版本号
      # 校验并报错（这就是 stable 那条一直在 setup 里挂的原因），所以干脆
      # 不传这个键——要固定版本才传 flutter-version，追最新只给 channel。
      - name: 安装 Flutter（固定版本 leg）
        if: matrix.flutter != 'stable'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - name: 安装 Flutter（最新稳定 leg）
        if: matrix.flutter == 'stable'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: JS 桥校验（注入脚本在 Dart 字符串里，analyze/test 看不见）
        run: node tool/check_bridges_js.mjs

      - name: 静态分析
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub | tee /tmp/analyze.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            # 匿名取不到 Actions 日志（/actions/jobs/{id}/logs 返回 403）：
            # 红了自己却看不到原因，等于没有门禁。把每条问题写成 ::error::
            # 注解，不登录也能用 /check-runs/{id}/annotations 读到。
            grep -E " • " /tmp/analyze.log | sed 's/%/%25/g' | head -40 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            {
              echo '### `flutter analyze` 失败'
              echo '```'
              cat /tmp/analyze.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: 单元测试
        shell: bash
        run: |
          set +e
          flutter test --no-pub --reporter expanded | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            grep -E "\[E\]|Expected:|Actual:|Which:" /tmp/test.log \
              | sed 's/%/%25/g' | head -40 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            {
              echo '### `flutter test` 失败（末 120 行）'
              echo '```'
              tail -120 /tmp/test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: 第三方 fork 门禁（只卡 error/warning，info 交给人工）
        shell: bash
        run: |
          # 根 analyze 已排除 third_party/**：vendored 上游代码的 deprecation
          # 不该拖死主门禁（本仓库曾因此长期全红）。这里单独立一道只卡
          # error/warning 的底线，info 级由 code review 与上游同步时处理。
          set -e
          for p in third_party/dartssh2 third_party/flutter_foreground_task; do
            dart analyze "$p"
          done

  build-apk:
    name: 构建 release APK（发版）
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传 APK 到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
